services:
  - type: web
    name: felix-gift-floors-x402
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FELIX_DIR
        value: felix-bot
      - key: PORTALS_PARTNERS_KEY
        sync: false
